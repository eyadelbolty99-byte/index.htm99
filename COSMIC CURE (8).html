<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>COSMIC CURE</title>
<style>
:root{color-scheme:dark;--bg:#0a1226;--p:#101c38;--p2:#14234a;--b:#22396b;--tx:#fff;--mu:#9db2d8;--cy:#22d3ee;--bl:#3b82f6;--wn:#f59e0b;--rd:#f43f5e;--ok:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;min-height:100%}nav{width:178px;background:var(--p);border-right:1px solid var(--b);padding:10px 8px;flex-shrink:0}
.logo{display:flex;gap:8px;align-items:center;padding:2px 6px 12px}.logo i{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--cy),var(--bl),var(--cy));display:grid;place-items:center;font-style:normal}
.logo b{letter-spacing:.1em;font-size:13px}.logo small{display:block;color:var(--mu);font-size:9px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:7px 10px;border-radius:7px;cursor:pointer;font:inherit}
nav button:hover{background:var(--p2)}nav button.on{background:var(--p2);color:var(--cy);box-shadow:inset 2px 0 var(--cy)}
main{flex:1;min-width:0;padding:12px 16px}.ban{background:#33260a;border:1px solid var(--wn);color:#fde68a;padding:4px 10px;border-radius:7px;font-size:11px;margin-bottom:10px}
h1{font-size:17px;margin:0 0 8px}h2{font-size:13px;margin:0 0 6px;color:var(--cy)}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px 12px}
.big{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:12px}canvas.ch{width:100%;height:130px;display:block}canvas.sp{width:100%;height:36px;display:block;margin-top:4px}
button.b,select,input{background:var(--bg);color:var(--tx);border:1px solid var(--b);border-radius:7px;padding:6px 10px;font:inherit}
button.b{cursor:pointer;background:var(--bl);border-color:var(--bl)}button.b:hover{filter:brightness(1.15)}button.s{background:var(--p2);border-color:var(--b)}button.r{background:var(--rd);border-color:var(--rd)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.tag{display:inline-block;padding:0 7px;border-radius:99px;font-size:10px;border:1px solid}
.rev{color:var(--wn);border-color:var(--wn)}.inf{color:var(--cy);border-color:var(--cy)}.sim{color:var(--wn);border-color:var(--wn)}
.al{border-left:3px solid var(--cy);padding:5px 9px;margin:5px 0;background:#0b1530;border-radius:6px}.al.rev{border-left-color:var(--wn)}.al.ack{opacity:.55}
.prof{display:flex;gap:10px;align-items:center}.prof img{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:2px solid var(--b)}
.bar{height:6px;background:var(--p2);border-radius:3px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--cy)}
.vw{position:relative;width:100%;max-width:560px;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;margin:0 auto}.vw video,.vw canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}.ld{position:absolute;inset:0;place-items:center;background:#000b}
table{width:100%;border-collapse:collapse}td,th{padding:3px 6px;border-bottom:1px solid var(--b);text-align:left}label{display:block;margin:5px 0 2px;color:var(--mu);font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin-right:5px}.dot.on{background:var(--ok)}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:3px;padding:6px}nav .logo{display:none}nav button{white-space:nowrap;width:auto}.g2{grid-template-columns:1fr}}
@media print{nav,.ban,.noprint{display:none}body{background:#fff;color:#000}.c{background:#fff;border-color:#999}h2{color:#000}}
svg.lucide{width:15px;height:15px;stroke:currentColor;vertical-align:-3px;margin-right:6px}.logo svg{width:26px;height:26px;margin:0;stroke:var(--cy)}
.top{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:10px;margin-bottom:10px}.top .g{margin-bottom:10px}.top .g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.prof{align-items:flex-start;gap:12px}.prof img{width:170px;height:255px;object-fit:cover;border-radius:10px;border:1px solid var(--b);flex-shrink:0}
@media(max-width:900px){.top{grid-template-columns:1fr}}@media(max-width:480px){.prof{flex-direction:column}.prof img{width:100%;height:auto;aspect-ratio:2/3}}
.qbox{text-align:center;transition:opacity .25s}.qa{font-size:17px;line-height:1.5;color:#fff;padding:2px 8px}
.crit{color:var(--rd);border-color:var(--rd)}
</style></head><body><div id="app"><nav id="nav"></nav><main><div id="pg"></div></main></div>

let asn={a:{},log:[],done:false,res:null},asSel=[];
const asNext=()=>{const v=vit();return AS_Q.find(q=>!(q.id in asn.a)&&q.w(asn.a,v))};
function asFin(){if(!asNext()){const r=assess(asn.a),v=vit();asn.res=r;asn.done=true;S.ah.unshift({id:uid(),t:now(),lv:r.lv,urgent:r.urgent,sym:(asn.a.sym||[]).join(', ')||'none',vit:['hr','sp','tp'].map(k=>v[k]?M[k][0]+' '+v[k].v+' ('+v[k].src+')':M[k][0]+' n/a').join('; ')});S.ah=S.ah.slice(0,30);if(r.lv=='High')alert_('Vital Signs Alert','Health assessment: High concern'+(r.urgent?' (urgent contact advised)':''),'Review','Rule-based assessment from your answers and readings. Contact the mission medical officer. This is not a diagnosis.',false,'WARNING');log('Health assessment completed: '+r.lv);save(true)}draw()}
window.asAns=i=>{const q=asNext();if(!q||q.m)return;const x=q.o[i];asn.a[q.id]=x;asn.log.push({id:q.id,q:q.t,a:x});asFin()};
window.asTog=i=>{const q=asNext();if(!q||!q.m)return;const x=q.o[i],j=asSel.indexOf(x);j<0?asSel.push(x):asSel.splice(j,1);draw()};
window.asMulti=()=>{const q=asNext();if(!q||!q.m||!asSel.length)return;asn.a[q.id]=asSel.slice();asn.log.push({id:q.id,q:q.t,a:asSel.join(', ')});asSel=[];asFin()};
window.asUndo=()=>{const l=asn.log.pop();if(!l)return;delete asn.a[l.id];asn.done=false;asn.res=null;asSel=[];draw()};
window.asReset=()=>{asn={a:{},log:[],done:false,res:null};asSel=[];draw()};
const asEff=w=>w>=3?'major':w>=1.5?'moderate':w>0?'minor':w<0?'lowers concern':'no concern from this alone';
const asPage=()=>{const v=vit(),q=asn.done?null:asNext(),r=asn.res,lc={Low:'inf',Moderate:'rev',High:'crit'};
 const vt=['hr','sp','tp'].map(k=>{const x=v[k];return`<tr><td>${M[k][0]}</td><td>${x?x.v+' '+M[k][1]:'no reading available'}</td><td>${x?x.src:''}</td><td>${x?(x.bad?'Outside configured range':'Within configured range'):''}</td></tr>`}).join('');
 const cur=q?`<div class="al rev"><b>${q.t}</b><div class="row">${q.o.map((o,i)=>q.m?`<button class="b ${asSel.includes(o)?'':'s'}" onclick="asTog(${i})">${o}</button>`:`<button class="b s" onclick="asAns(${i})">${o}</button>`).join('')}</div>${q.m?'<div class="row"><button class="b" onclick="asMulti()">Continue</button></div>':''}</div>`:'';
 const res=r?`<div class="c"><h2>Assessment result</h2><div class="row"><span class="tag ${lc[r.lv]}">${r.lv} concern</span><span class="mu">${ft(now())}</span></div>${r.urgent?`<div class="al crit"><b>Contact the mission medical officer urgently.</b><div class="mu">Warning signs reported:</div>${r.rf.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}
<h2 style="margin-top:6px">What influenced this assessment</h2><div class="mu"><b>Measurements</b></div>${r.M_.map(x=>`<div class="mu">${esc(x)}</div>`).join('')}<div class="mu"><b>Answers and readings</b></div>${r.R_.map(x=>`<div class="mu">${esc(x.t)} <span class="tag inf">${asEff(x.w)}</span></div>`).join('')}
<h2 style="margin-top:6px">Possible factors (not a diagnosis)</h2>${r.fx.map(x=>`<div class="mu">${x}</div>`).join('')}<h2 style="margin-top:6px">Recommended next steps</h2>${r.nx.map(x=>`<div class="mu">${x}</div>`).join('')}
<h2 style="margin-top:6px">Limitations</h2>${r.lim.map(x=>`<div class="mu">${esc(x)}</div>`).join('')}<div class="mu">This is a rule-based assessment, not a medical diagnosis. It cannot confirm or rule out any condition. Normal readings do not mean you are healthy.</div><div class="mu">No real sensor is connected: readings are simulated or entered manually.</div><div class="row"><button class="b" onclick="asReset()">Start new assessment</button></div></div>`:'';
 return`<h1>Health Assessment <span class="tag sim">rule-based</span></h1><div class="g g2"><div class="c"><h2>Conversation</h2><div class="mu">This assistant asks one question at a time and adapts to your answers. It is a rule-based tool, not a diagnosis, and it does not replace the mission medical officer.</div>${asn.log.map(l=>`<div class="al"><div class="mu">${l.q}</div><b>${esc(l.a)}</b></div>`).join('')}${cur}<div class="row"><button class="b s" onclick="asUndo()">Undo last answer</button><button class="b s" onclick="asReset()">Restart</button></div></div><div class="c"><h2>Current readings</h2><table>${vt}</table><div class="mu">No real sensor is connected: readings are simulated or entered manually.</div><div class="mu">Sleep: ${S.sl.length?last('sl')+' h ('+src('sl')+')':'no data'} · Stress: ${S.st.length?last('st')+'/10 ('+src('st')+')':'no data'}</div></div></div>${res}<div class="c"><h2>Assessment history</h2>${S.ah.length?`<table><tr><th>Time</th><th>Level</th><th>Symptoms</th><th>Readings</th></tr>${S.ah.slice(0,8).map(h=>`<tr><td>${ft(h.t)}</td><td>${h.lv} concern${h.urgent?' <span class="tag crit">urgent</span>':''}</td><td>${esc(h.sym)}</td><td>${esc(h.vit)}</td></tr>`).join('')}</table>`:'<span class="mu">No assessments yet</span>'}</div>`};
{const si=PAGES.indexOf('Settings');PAGES.splice(si,0,'Health Assessment');IC.splice(si,0,'stethoscope');SH.splice(si,0,'Assessment');P.splice(si,0,asPage)}
renderNav();draw();
</script>
